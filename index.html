<div id="neon-root" class="neon-root">

  <div class="neon-header">
    <div class="neon-header__left">
      <span class="neon-header__icon">⬡</span>
      <div>
        <div class="neon-header__title">Servidores Críticos</div>
        <div class="neon-header__meta" id="neon-meta">—</div>
      </div>
    </div>
    <div class="neon-header__right">
      <span class="neon-badge neon-badge--ok"   id="cnt-ok">  ◆ 0 OK</span>
      <span class="neon-badge neon-badge--warn"  id="cnt-warn">◆ 0 WARN</span>
      <span class="neon-badge neon-badge--crit"  id="cnt-crit">◆ 0 CRIT</span>
    </div>
  </div>

  <div class="neon-colheads">
    <div data-col="Servidor">Servidor</div>
    <div data-col="Status">Status</div>
    <div data-col="CPU"     class="num">CPU</div>
    <div data-col="Memoria" class="num">Memória</div>
    <div data-col="Disco"   class="num">Disco</div>
    <div data-col="Uptime"  class="num">Uptime</div>
  </div>

  <div class="neon-body" id="neon-body">
    <div class="neon-empty" id="neon-empty">// AGUARDANDO DADOS //</div>
  </div>

  <div class="neon-footer">
    <div id="neon-footer-left">// GRAFANA HTML GRAPHICS //</div>
    <div id="neon-footer-right"></div>
  </div>

</div>
